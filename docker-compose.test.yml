# =============================================================================
# CAIMP v2 — Lightweight test override for low-RAM environments (≤ 4 GB)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
#
# What this does:
#   - Moves Ollama, Prometheus, Grafana, splunk-hec-bridge to the [full]
#     profile so they are NOT started (no model download, no heavy RAM usage)
#   - Switches Ollama model to llama3.2:1b (~1.3 GB) if you DO want Ollama
#   - Caps every container's memory so nothing gets OOM-killed
#   - Drops AI worker concurrency to 1
#   - Raises anomaly thresholds so low-traffic test data still triggers events
# =============================================================================

services:

  # ── Disabled in test mode (move to [full] profile) ──────────────────────

  ollama:
    profiles: [full]   # start with --profile full if you want local LLM

  prometheus:
    profiles: [full]

  grafana:
    profiles: [full]

  splunk-hec-bridge:
    profiles: [full]   # only needed when a Splunk instance is configured

  # ── Smaller Ollama model (used when --profile full IS active) ───────────
  # Overrides the default llama3.1:8b → llama3.2:1b  (~1.3 GB vs ~5 GB)

  ai-orchestrator:
    environment:
      OLLAMA_MODEL: ${OLLAMA_LLM_MODEL:-llama3.2:1b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}

  ai-worker:
    environment:
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-llama3.2:1b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      AI_WORKER_CONCURRENCY: "1"   # one at a time on a small VM

  forecast-engine:
    environment:
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-llama3.2:1b}

  # ── Lower anomaly thresholds (easier to trigger events with test traffic) ─

  telemetry-writer:
    environment:
      CPU_THRESHOLD_PCT: "70"
      RAM_THRESHOLD_PCT: "70"
      DISK_THRESHOLD_PCT: "70"

  # ── Memory caps (keep total RSS under ~3 GB, leaving 1 GB for kernel/Docker)

  postgres:
    mem_limit: 512m
    memswap_limit: 768m

  redis:
    mem_limit: 192m
    memswap_limit: 256m

  nats:
    mem_limit: 96m
    memswap_limit: 128m

  admin-api:
    mem_limit: 256m
    memswap_limit: 320m

  query-api:
    mem_limit: 256m
    memswap_limit: 320m

  ai-orchestrator:
    mem_limit: 256m
    memswap_limit: 320m

  ai-worker:
    mem_limit: 256m
    memswap_limit: 320m

  alert-engine:
    mem_limit: 128m
    memswap_limit: 192m

  forecast-engine:
    mem_limit: 192m
    memswap_limit: 256m

  telemetry-writer:
    mem_limit: 128m
    memswap_limit: 192m

  ws-gateway:
    mem_limit: 128m
    memswap_limit: 192m

  frontend:
    mem_limit: 128m
    memswap_limit: 192m

  nginx:
    mem_limit: 64m
    memswap_limit: 64m
