[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "caimp-auth"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "bcrypt>=4.0.0",
    "asyncpg>=0.29.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["caimp_auth*"]
