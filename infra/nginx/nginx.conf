# =============================================================================
# CAIMP v2 — Nginx reverse proxy (Phase 0 base)
# TLS termination, rate limiting, upstream routing.
# Application upstreams are added as services come online in later phases.
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    gzip                on;
    gzip_types          text/plain application/json application/javascript text/css;

    # ---------------------------------------------------------------------------
    # Rate limiting zones
    # ---------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api:10m rate=200r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # ---------------------------------------------------------------------------
    # Upstreams (populated as services are added in later phases)
    # ---------------------------------------------------------------------------
    upstream query_api {
        server query-api:8002;
        keepalive 32;
    }

    upstream admin_api {
        server admin-api:8001;
        keepalive 16;
    }

    upstream ws_gateway {
        server ws-gateway:8080;
        keepalive 64;
        # Sticky sessions for WebSocket
        ip_hash;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    upstream grafana {
        server grafana:3000;
        keepalive 8;
    }

    upstream ai_orchestrator {
        server ai-orchestrator:8010;
        keepalive 16;
    }

    upstream change_tracker {
        server change-tracker:8011;
        keepalive 8;
    }

    # ---------------------------------------------------------------------------
    # Security headers applied to all responses
    # ---------------------------------------------------------------------------
    map $sent_http_content_type $csp_header {
        default                    "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'self' ws: wss:; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'";
        "~*text/html"              "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'self' ws: wss:; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'";
    }

    # ---------------------------------------------------------------------------
    # HTTP — redirect to HTTPS (enable when certs are provisioned)
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # ---------------------------------------------------------------------------
        # Security headers
        # ---------------------------------------------------------------------------
        add_header X-Content-Type-Options    "nosniff"          always;
        add_header X-Frame-Options           "DENY"             always;
        add_header X-XSS-Protection          "1; mode=block"    always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        # Enable HSTS when TLS is active:
        # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy   $csp_header        always;

        # Remove server version banner
        server_tokens off;

        # Health check endpoint (used by Docker healthcheck)
        location /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # TODO: uncomment when TLS certs are available
        # return 301 https://$host$request_uri;

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://query_api/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        location /admin/v1/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://admin_api/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://admin_api/auth/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
        }

        # Change Tracker — GitHub/GitLab webhooks + agent change events
        location /api/changes/ {
            proxy_pass         http://change_tracker/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            limit_req          zone=api burst=30 nodelay;
        }

        # AI Orchestrator — chat SSE + webhook (buffering disabled for streaming)
        location /api/ai/ {
            proxy_pass         http://ai_orchestrator/;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering    off;
            proxy_cache        off;
            add_header         X-Accel-Buffering no always;
        }

        location /ws/ {
            proxy_pass         http://ws_gateway/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
        }

        # Grafana — served under /grafana sub-path (GF_SERVER_SERVE_FROM_SUB_PATH=true)
        location /grafana/ {
            proxy_pass         http://grafana/grafana/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Grafana WebSocket (live panels)
        location /grafana/api/live/ {
            proxy_pass         http://grafana/grafana/api/live/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }
    }
}
