# =============================================================================
# NATS Server Configuration — CAIMP v2
# JetStream enabled with file-backed storage.
# =============================================================================

server_name: caimp-nats

# Client port
port: 4222

# HTTP monitoring
http_port: 8222

# JetStream
jetstream {
    store_dir: "/data"
    # Max memory for JetStream (rest goes to disk)
    max_memory_store: 256MB
    max_file_store: 50GB
}

# Authentication
accounts {
    $SYS {
        users: [{ user: "_sys", password: $SYS_PASSWORD }]
    }
    CAIMP {
        users: [
            { user: $NATS_USER, password: $NATS_PASSWORD }
        ]
        jetstream: enabled
    }
}

# Allow anonymous connections in development (disabled by env override)
# In production: remove the no_auth_user line.
no_auth_user: $NATS_USER

# Logging
debug: false
trace: false
logtime: true

# Limits
max_payload: 8MB
max_connections: 10000
write_deadline: "10s"
