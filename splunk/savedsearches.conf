# =============================================================================
# CAIMP — Splunk Saved Searches
# Training searches (Step 6) + Anomaly detection searches (Step 7)
# Copy to: $SPLUNK_HOME/etc/system/local/savedsearches.conf
# Merge with existing file if one already exists — do not overwrite.
# =============================================================================

# -----------------------------------------------------------------------------
# ANOMALY DETECTION SCORING — run every 1–5 minutes, trigger alert action
# Prerequisite: MLTK models must be trained first (Step 6).
# Alert action: caimp_webhook POSTs anomaly JSON to AI Orchestrator.
# -----------------------------------------------------------------------------

[CAIMP - CPU Anomaly Detection]
search = | mstats avg(_value) as cpu_pct WHERE index=caimp_metrics \
           metric_name=system.cpu.utilization span=1m BY host, org_id \
         | eval score=0 \
         | apply cpu_density_model \
         | where IsOutlier=1 OR cpu_pct > 95 \
         | eval anomaly_type="cpu_saturation", \
                severity=if(cpu_pct>95,"critical","high") \
         | table _time, host, org_id, cpu_pct, score, anomaly_type, severity
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = * * * * *
enableSched = 1
alert.track = 1
alert.condition = search count > 0
alert.actions = caimp_webhook
action.caimp_webhook.param.endpoint = http://ai-orchestrator:8010/webhook/anomaly
description = Scores CPU utilization with DensityFunction every minute. \
              Fires when IsOutlier=1 (MLTK) or cpu_pct > 95%. \
              Requires app:cpu_density_model to be trained (Step 6).

[CAIMP - Memory Anomaly Detection]
search = | mstats avg(_value) as mem_pct WHERE index=caimp_metrics \
           metric_name=system.memory.utilization span=1m BY host, org_id \
         | apply mem_density_model \
         | where IsOutlier=1 OR mem_pct > 90 \
         | eval anomaly_type="memory_pressure", \
                severity=if(mem_pct>90,"critical","high") \
         | table _time, host, org_id, mem_pct, score, anomaly_type, severity
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = * * * * *
enableSched = 1
alert.track = 1
alert.condition = search count > 0
alert.actions = caimp_webhook
action.caimp_webhook.param.endpoint = http://ai-orchestrator:8010/webhook/anomaly
description = Scores memory utilization with DensityFunction every minute. \
              Fires when IsOutlier=1 (MLTK) or mem_pct > 90%. \
              Requires app:mem_density_model to be trained (Step 6).

[CAIMP - Disk Anomaly Detection]
search = | mstats avg(_value) as disk_pct WHERE index=caimp_metrics \
           metric_name=system.disk.utilization span=1m BY host, org_id \
         | where disk_pct > 85 \
         | eval anomaly_type="disk_fill", \
                severity=if(disk_pct>90,"critical","high") \
         | table _time, host, org_id, disk_pct, anomaly_type, severity
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
alert.track = 1
alert.condition = search count > 0
alert.actions = caimp_webhook
action.caimp_webhook.param.endpoint = http://ai-orchestrator:8010/webhook/anomaly
description = Threshold-only disk detection (no MLTK model needed). \
              Fires when disk_pct > 85%. Runs every 5 minutes.

[CAIMP - Network Traffic Forecast]
search = | mstats avg(_value) as net_bytes WHERE index=caimp_metrics \
           metric_name=system.network.io.bytes_recv span=5m BY host, org_id \
         | timechart span=5m avg(net_bytes) as actual BY host \
         | fit StateSpaceForecast actual holdback=12 conf_interval=95 \
         | where actual < lower95 OR actual > upper95 \
         | eval anomaly_type="network_anomaly", severity="medium"
dispatch.earliest_time = -6h
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
alert.track = 1
alert.condition = search count > 0
alert.actions = caimp_webhook
action.caimp_webhook.param.endpoint = http://ai-orchestrator:8010/webhook/anomaly
description = Uses StateSpaceForecast to detect network traffic anomalies. \
              Fires when actual traffic falls outside 95% confidence interval. \
              Runs every 5 minutes. No pre-training required.

# -----------------------------------------------------------------------------
# MLTK MODEL TRAINING — run once manually first, then weekly
# Before first run: ensure 7+ days of metric data in caimp_metrics index.
# To run manually: Splunk Web → Settings → Searches, Reports & Alerts →
#   find the search → Run
# -----------------------------------------------------------------------------

[CAIMP - Train CPU Density Model]
search = | mstats avg(_value) as cpu_pct WHERE index=caimp_metrics \
           metric_name=system.cpu.utilization span=1m \
         | fit DensityFunction cpu_pct threshold=0.01 into app:cpu_density_model
dispatch.earliest_time = -7d
dispatch.latest_time = now
cron_schedule = 0 2 * * 0
enableSched = 1
description = Trains a DensityFunction model on 7 days of CPU utilization. \
              Runs weekly on Sunday at 02:00 UTC. Run manually on first deploy.

[CAIMP - Train Memory Density Model]
search = | mstats avg(_value) as mem_pct WHERE index=caimp_metrics \
           metric_name=system.memory.utilization span=1m \
         | fit DensityFunction mem_pct threshold=0.01 into app:mem_density_model
dispatch.earliest_time = -7d
dispatch.latest_time = now
cron_schedule = 0 3 * * 0
enableSched = 1
description = Trains a DensityFunction model on 7 days of memory utilization. \
              Runs weekly on Sunday at 03:00 UTC. Run manually on first deploy.
