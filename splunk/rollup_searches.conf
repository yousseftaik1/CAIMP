[CAIMP - 5-Minute Metric Rollup]
search = | mstats avg(_value) as avg_val, max(_value) as max_val, \
           min(_value) as min_val, count(_value) as sample_count \
           WHERE index=caimp_metrics span=5m earliest=-10m latest=-5m \
           BY host, org_id, server_id, metric_name \
         | eval tier="5m" \
         | collect index=caimp_metrics_5m
cron_schedule = */5 * * * *
enableSched = 1
dispatch.earliest_time = -10m
dispatch.latest_time = -5m

[CAIMP - 1-Hour Metric Rollup]
search = | mstats avg(_value) as avg_val, max(_value) as max_val, \
           min(_value) as min_val, count(_value) as sample_count, \
           stdev(_value) as stddev_val \
           WHERE index=caimp_metrics span=1h earliest=-2h latest=-1h \
           BY host, org_id, server_id, metric_name \
         | eval tier="1h" \
         | collect index=caimp_metrics_1h
cron_schedule = 5 * * * *
enableSched = 1
dispatch.earliest_time = -2h
dispatch.latest_time = -1h

[CAIMP - 1-Day Metric Rollup]
search = | mstats avg(_value) as avg_val, max(_value) as max_val, \
           min(_value) as min_val, stdev(_value) as stddev_val, \
           perc95(_value) as p95_val \
           WHERE index=caimp_metrics span=1d earliest=-2d@d latest=-1d@d \
           BY host, org_id, server_id, metric_name \
         | eval tier="1d" \
         | collect index=caimp_metrics_1d
cron_schedule = 0 1 * * *
enableSched = 1
dispatch.earliest_time = -2d@d
dispatch.latest_time = -1d@d

[CAIMP - 24h Baseline Compute]
search = | mstats avg(_value) as avg_val, stdev(_value) as stddev_val, \
           min(_value) as min_val, max(_value) as max_val, \
           perc5(_value) as p5_val, perc95(_value) as p95_val \
           WHERE index=caimp_metrics span=24h earliest=-24h latest=now \
           BY host, org_id, metric_name \
         | eval computed_at=now() \
         | outputlookup caimp_baselines
cron_schedule = */5 * * * *
enableSched = 1
dispatch.earliest_time = -24h
dispatch.latest_time = now
