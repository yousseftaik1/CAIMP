[caimp_webhook]
python.version = python3
label = CAIMP AI Webhook
description = Sends anomaly payload to CAIMP AI Orchestrator for LLM analysis.
icon_path = caimp.png
payload_format = json

param.endpoint.label = AI Orchestrator webhook URL
param.endpoint.description = Full URL of the /webhook/anomaly endpoint
param.endpoint.default = http://ai-orchestrator:8010/webhook/anomaly
param.endpoint.required_on_create = true
