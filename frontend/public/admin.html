<script>
// ═══════════════════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════════════════
const AUTH_URL = '/auth'
const API_URL  = '/api/v1'
const WS_URL   = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/events`

// ═══════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════
const S = {
  token: null, orgId: null, user: null,
  view: 'overview',
  servers: [], stats: null, incidents: [], runbooks: [],
  ws: null, wsOk: false,
}

// ═══════════════════════════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════════════════════════
function decodeJWT(t) {
  if (!t) return null
  try { return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))) }
  catch { return null }
}

async function doLogin(email, password) {
  const r = await fetch(`${AUTH_URL}/login`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({email, password}),
  })
  if (!r.ok) {
    const e = await r.json().catch(()=>({}))
    throw new Error(e.detail || 'Invalid credentials')
  }
  const d = await r.json()
  S.token = d.access_token
  const p = decodeJWT(S.token)
  S.orgId = p?.org_id
  S.user  = {email: p?.sub || email, role: p?.role}
  localStorage.setItem('caimp_token', S.token)
  if (S.orgId) localStorage.setItem('caimp_org', S.orgId)
}

function doLogout() {
  localStorage.removeItem('caimp_token')
  localStorage.removeItem('caimp_org')
  location.reload()
}

function loadAuth() {
  const t = localStorage.getItem('caimp_token')
  if (!t) return false
  const p = decodeJWT(t)
  if (!p) return false
  if (p.exp && Date.now()/1000 > p.exp) { localStorage.removeItem('caimp_token'); return false }
  S.token = t
  S.orgId = p.org_id || localStorage.getItem('caimp_org')
  S.user  = {email: p.sub || 'Admin', role: p.role}
  return true
}

// ═══════════════════════════════════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════════════════════════════════
async function apiGet(path) {
  const r = await fetch(`${API_URL}${path}`, {headers:{Authorization:`Bearer ${S.token}`}})
  if (r.status === 401) { doLogout(); return null }
  if (!r.ok) throw new Error(`HTTP ${r.status}`)
  return r.json()
}

async function apiPost(path, body) {
  const r = await fetch(`${API_URL}${path}`, {
    method:'POST',
    headers:{Authorization:`Bearer ${S.token}`,'Content-Type':'application/json'},
    body: JSON.stringify(body),
  })
  if (r.status === 401) { doLogout(); return null }
  return r.ok ? r.json().catch(()=>null) : null
}

// ═══════════════════════════════════════════════════════════════════════════
// DATA LOADING
// ═══════════════════════════════════════════════════════════════════════════
async function loadAll() {
  setStatus('loading')
  try {
    const [srvRes, statRes, incRes] = await Promise.allSettled([
      apiGet('/servers'),
      apiGet('/incidents/stats'),
      apiGet('/incidents?limit=100'),
    ])
    if (srvRes.status  === 'fulfilled' && srvRes.value)  S.servers   = srvRes.value
    if (statRes.status === 'fulfilled' && statRes.value) S.stats     = statRes.value
    if (incRes.status  === 'fulfilled' && incRes.value)  S.incidents = incRes.value
    setStatus('ok')
    renderCurrent()
  } catch (e) {
    setStatus('error')
    console.error(e)
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// WEBSOCKET
// ═══════════════════════════════════════════════════════════════════════════
function connectWS() {
  try {
    const url = S.orgId ? `${WS_URL}?org_id=${S.orgId}` : WS_URL
    S.ws = new WebSocket(url)
    S.ws.onopen    = () => { S.wsOk = true;  updateSvc('svc-ws', true)  }
    S.ws.onclose   = () => { S.wsOk = false; updateSvc('svc-ws', false); setTimeout(connectWS, 5000) }
    S.ws.onerror   = () => { S.wsOk = false; updateSvc('svc-ws', false) }
    S.ws.onmessage = (e) => { try { handleWS(JSON.parse(e.data)) } catch {} }
  } catch { updateSvc('svc-ws', false) }
}

function handleWS(msg) {
  const t = msg.type || msg.event_type || ''
  if (/anomaly/i.test(t) || /incident/i.test(t)) { loadAll() }
  else if (/explanation/i.test(t) && S.view === 'overview') { loadAll() }
}

// ═══════════════════════════════════════════════════════════════════════════
// SERVICE HEALTH PROBES
// ═══════════════════════════════════════════════════════════════════════════
async function probeServices() {
  const checks = await Promise.allSettled([
    fetch('/api/v1/health', {headers:{Authorization:`Bearer ${S.token}`}, signal:AbortSignal.timeout(3000)}).then(r=>r.ok),
    fetch('/api/ai/health', {signal:AbortSignal.timeout(3000)}).then(r=>r.ok),
  ])
  updateSvc('svc-query', checks[0].status==='fulfilled' && checks[0].value)
  updateSvc('svc-ai',    checks[1].status==='fulfilled' && checks[1].value)
}

function updateSvc(id, ok) {
  const el = document.getElementById(id)
  if (!el) return
  const dot = el.querySelector('div')
  if (dot) dot.style.background = ok ? '#006a61' : '#75777d'
  el.style.color = ok ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.4)'
}

// ═══════════════════════════════════════════════════════════════════════════
// STATUS PILL
// ═══════════════════════════════════════════════════════════════════════════
function setStatus(state) {
  const dot  = document.getElementById('status-dot')
  const text = document.getElementById('status-text')
  if (!dot || !text) return
  const map = {
    loading: ['#d97706', 'Refreshing…'],
    ok:      ['#006a61', `Live — ${new Date().toLocaleTimeString()}`],
    error:   ['#ba1a1a', 'Connection error'],
  }
  const [color, label] = map[state] || map.ok
  dot.style.background = color
  text.textContent = label
}

// ═══════════════════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════════════════
function switchView(view) {
  S.view = view
  // Update nav buttons
  document.querySelectorAll('.nav-btn').forEach(btn => {
    const active = btn.dataset.view === view
    btn.className = `nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm cursor-pointer transition-all text-left ${
      active
        ? 'bg-white/10 text-secondary-fixed font-semibold border-l-2 border-secondary-fixed pl-[10px]'
        : 'text-on-primary-container/70 hover:text-white hover:bg-white/5 font-normal border-l-2 border-transparent pl-[10px]'
    }`
  })
  // Show/hide views
  document.querySelectorAll('.view').forEach(el => {
    el.classList.toggle('hidden', !el.id.endsWith(view))
  })
  // Page title
  const titles = {overview:'Overview', servers:'Servers', incidents:'Incidents', runbooks:'Runbooks'}
  document.getElementById('page-title').textContent = titles[view] || view
  // Render
  if (view === 'overview')  renderOverview()
  if (view === 'servers')   renderServers()
  if (view === 'incidents') renderIncidents()
  if (view === 'runbooks')  renderRunbooks()
}

function renderCurrent() { switchView(S.view) }

// ═══════════════════════════════════════════════════════════════════════════
// CHART HELPERS
// ═══════════════════════════════════════════════════════════════════════════
function areaChart(data, color='#006a61') {
  const W=520, H=200, PL=36, PR=8, PT=10, PB=28
  const cw=W-PL-PR, ch=H-PT-PB
  const max = Math.max(...data.map(d=>d.v), 1)
  const pts = data.map((d,i)=>({
    x: PL + (i/(data.length-1))*cw,
    y: PT + (1-d.v/max)*ch,
    ...d
  }))
  const line = pts.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')
  const area = `${line} L${pts[pts.length-1].x.toFixed(1)},${(PT+ch).toFixed(1)} L${PL},${(PT+ch).toFixed(1)} Z`
  const grids = [0,.25,.5,.75,1].map(f=>{
    const y=PT+(1-f)*ch, v=Math.round(f*max)
    return `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="#e0e3e5" stroke-width="1"/>
            <text x="${PL-4}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="#75777d">${v}</text>`
  }).join('')
  const dots = pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="white" stroke="${color}" stroke-width="2"><title>${p.label||''}: ${p.v}</title></circle>`).join('')
  const labels = pts.map(p=>`<text x="${p.x.toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="#75777d">${p.label||''}</text>`).join('')
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="overflow:visible">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".18"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grids}
    <path d="${area}" fill="url(#ag)"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
    ${dots}${labels}
  </svg>`
}

function donutChart(segs, size=160) {
  const total = segs.reduce((s,g)=>s+g.v,0)
  if (!total) return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${size/2-12}" fill="transparent" stroke="#e0e3e5" stroke-width="14"/></svg>`
  const r=size/2-12, cx=size/2, cy=size/2, sw=14, circ=2*Math.PI*r
  let off=0
  const arcs = segs.map(g=>{
    const dash=(g.v/total)*circ, gap=circ-dash
    const arc=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="transparent" stroke="${g.color}" stroke-width="${sw}"
      stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}"
      stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 ${cx} ${cy})"><title>${g.label}: ${g.v}</title></circle>`
    off+=dash; return arc
  }).join('')
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="transparent" stroke="#e0e3e5" stroke-width="${sw}"/>
    ${arcs}
  </svg>`
}

// ═══════════════════════════════════════════════════════════════════════════
// KPI CARD
// ═══════════════════════════════════════════════════════════════════════════
function kpiCard({icon, label, value, badge, badgeOk=true, iconBg='bg-secondary-container/20 text-secondary'}) {
  const badgeColor = badgeOk ? 'text-secondary' : 'text-on-tertiary-container'
  const badgeIcon  = badgeOk ? 'trending_up'    : 'warning'
  return `
  <div class="kpi-hover bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex flex-col justify-between hover:border-secondary transition-colors duration-300 cursor-default">
    <div class="flex justify-between items-start">
      <span class="p-2 ${iconBg} rounded-lg"><span class="material-symbols-outlined">${icon}</span></span>
      ${badge ? `<span class="flex items-center gap-1 ${badgeColor} text-xs font-semibold">${badge}<span class="material-symbols-outlined text-sm">${badgeIcon}</span></span>` : ''}
    </div>
    <div class="mt-4">
      <p class="text-on-surface-variant text-xs font-semibold uppercase tracking-wider">${label}</p>
      <h3 class="text-2xl font-bold text-on-surface mt-0.5">${value}</h3>
    </div>
  </div>`
}

// ═══════════════════════════════════════════════════════════════════════════
// SEV / STATUS HELPERS
// ═══════════════════════════════════════════════════════════════════════════
const SEV_COLOR = {critical:'#ba1a1a', high:'#ea580c', medium:'#d97706', low:'#006a61'}
const AI_COLOR  = {complete:'#006a61', error:'#ba1a1a', pending:'#d97706'}
const TYPE_LABEL = {cpu_saturation:'CPU Saturation', memory_pressure:'Memory Pressure', disk_fill:'Disk Fill', network_anomaly:'Network Anomaly', security_event:'Security Event'}

function sevBadge(sev) {
  const c = SEV_COLOR[sev] || '#75777d'
  return `<span style="background:${c}18;color:${c}" class="px-2 py-0.5 text-[10px] font-bold rounded-full uppercase tracking-wider">${sev}</span>`
}
function aiBadge(s) {
  if (!s) return '<span class="text-on-surface-variant text-xs">—</span>'
  const c = AI_COLOR[s] || '#75777d'
  return `<span style="background:${c}15;color:${c}" class="px-2 py-0.5 text-[10px] font-bold rounded-full uppercase tracking-wider">${s}</span>`
}
function initials(str) { return (str||'??').slice(0,2).toUpperCase() }

function renderOverview() {
  const srv = S.servers, st = S.stats, inc = S.incidents
  const online   = srv.filter(s=>s.status==='online').length
  const critical = st?.by_severity?.critical ?? 0
  const high     = st?.by_severity?.high     ?? 0
  const medium   = st?.by_severity?.medium   ?? 0
  const low      = st?.by_severity?.low      ?? 0

  const now = new Date()
  const days = Array.from({length:7},(_,i)=>{

    return {label:d.toLocaleDateString([],{weekday:'short'}), date:d.toDateString(), v:0}

    ${kpiCard({icon:'warning', label:'Total Incidents', value:total, badge:critical>0?`${critical} critical`:null, badgeOk:false, iconBg:'bg-error-container/30 text-on-error-container'})}
    ${kpiCard({icon:'smart_toy', label:'Pending AI Analysis', value:pending, badge:pending>0?'In pipeline':null, badgeOk:false, iconBg:'bg-tertiary-fixed/30 text-on-tertiary-container'})}
  </section>

  <!-- Charts -->
  <section class="grid grid-cols-1 lg:grid-cols-3 gap-5">
    <div class="lg:col-span-2 bg-surface-container-lowest border border-outline-variant rounded-xl p-5 flex flex-col">

// VIEW: SERVERS
// ═══════════════════════════════════════════════════════════════════════════
function renderServers() {
  const srv = S.servers
  const online = srv.filter(s=>s.status==='online').length

  const rows = srv.map(s=>{
    const on = s.status==='online'
    const sc = on ? '#006a61' : '#75777d'
    const cpu  = s.cpu_pct  != null ? s.cpu_pct.toFixed(1)+'%'  : '—'
    const ram  = s.ram_pct  != null ? s.ram_pct.toFixed(1)+'%'  : '—'
    const disk = s.disk_pct != null ? s.disk_pct.toFixed(1)+'%' : '—'

    function bar(val, warn=70, danger=90) {
      if (val==null) return '<span class="text-on-surface-variant">—</span>'
      const pct = parseFloat(val)
      const color = pct>=danger ? '#ba1a1a' : pct>=warn ? '#d97706' : '#006a61'
      return `<div class="flex items-center gap-2">
        <div class="w-16 h-1.5 bg-outline-variant rounded-full overflow-hidden">
          <div class="h-full rounded-full" style="width:${Math.min(pct,100)}%;background:${color}"></div>
        </div>
        <span class="font-mono text-xs text-on-surface">${val}</span>
      </div>`
    }

    return `<tr class="hover:bg-surface-container-low transition-colors">
      <td class="px-5 py-3">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-full bg-secondary-container/30 text-secondary flex items-center justify-center text-xs font-bold flex-shrink-0">${initials(s.name||s.hostname)}</div>
          <div>
            <div class="text-sm font-semibold text-on-surface">${s.name||s.hostname||'—'}</div>
            <div class="font-mono text-[10px] text-on-surface-variant">${s.hostname||''}</div>
          </div>
        </div>
      </td>
      <td class="px-5 py-3">
        <div class="flex items-center gap-1.5">
          <div class="w-2 h-2 rounded-full" style="background:${sc}"></div>
          <span class="text-xs font-semibold" style="color:${sc}">${on?'Online':'Offline'}</span>
        </div>
      </td>
      <td class="px-5 py-3">${bar(s.cpu_pct)}</td>
      <td class="px-5 py-3">${bar(s.ram_pct)}</td>
      <td class="px-5 py-3">${bar(s.disk_pct,80,95)}</td>
      <td class="px-5 py-3 font-mono text-xs text-on-surface">${s.anomaly_count??'—'}</td>
    </tr>`
  }).join('')

  document.getElementById('view-servers').innerHTML = `
  <section class="grid grid-cols-3 gap-4">
    ${kpiCard({icon:'dns', label:'Total Servers', value:srv.length, badge:'', badgeOk:true})}
    ${kpiCard({icon:'check_circle', label:'Online', value:online, badge:'', badgeOk:true})}
    ${kpiCard({icon:'cancel', label:'Offline', value:srv.length-online, badge:'', badgeOk:false, iconBg:'bg-error-container/30 text-on-error-container'})}
  </section>
  <section class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden">
    <div class="px-5 py-4 border-b border-outline-variant">
      <h4 class="text-base font-semibold text-on-surface">All Servers</h4>
      <p class="text-sm text-on-surface-variant">Live metrics from CAIMP monitoring agents</p>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left">
        <thead><tr class="bg-surface-container-low">
          <th class="px-5 py-3 text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Server</th>
          <th class="px-5 py-3 text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Status</th>
          <th class="px-5 py-3 text-xs font-semibold text-on-surface-variant uppercase tracking-wider">CPU</th>
          <th class="px-5 py-3 text-xs font-semibold text-on-surface-variant uppercase tracking-wider">RAM</th>
          <th class="px-5 py-3 text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Disk</th>
          <th class="px-5 py-3 text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Anomalies</th>
        </tr></thead>
        <tbody class="divide-y divide-outline-variant/30">
          ${rows||'<tr><td colspan="6" class="px-5 py-12 text-center text-on-surface-variant">No servers found</td></tr>'}
        </tbody>
      </table>
    </div>
  </section>`
}

async function expandRow(id, row) {
  const existingId = `detail-${id}`
  const existing = document.getElementById(existingId)
  if (existing) { existing.remove(); row.style.background=''; return }
  row.style.background = 'var(--tw-color-surface-container, #eceef0)'

  const detail = document.createElement('tr')
  detail.id = existingId
  detail.innerHTML = `<td colspan="8" class="px-0 py-0">
    <div class="mx-4 my-3 border border-outline-variant rounded-xl p-5 bg-surface">
      <div class="flex items-center gap-2 text-on-surface-variant text-sm"><span class="spin material-symbols-outlined">refresh</span>Loading AI analysis…</div>
    </div></td>`
  row.insertAdjacentElement('afterend', detail)

  try {
    const d = await apiGet(`/incidents/${id}`)
    const exp = d?.explanation
    if (!exp) { detail.querySelector('div').innerHTML='<p class="text-sm text-on-surface-variant">No AI analysis available.</p>'; return }

    const sc = SEV_COLOR[exp.severity]||'#75777d'
    const cc = {high:'#006a61',medium:'#d97706',low:'#ba1a1a'}[exp.confidence]||'#75777d'

    detail.querySelector('div').innerHTML = `
      <div class="flex items-center gap-3 mb-4 flex-wrap">
        <span class="text-xs font-bold text-secondary uppercase tracking-wider">AI Analysis</span>
        ${exp.severity?`<span style="background:${sc}18;color:${sc}" class="px-2 py-0.5 text-[10px] font-bold rounded-full uppercase">${exp.severity}</span>`:''}
        ${exp.confidence?`<span style="color:${cc}" class="text-xs font-semibold">Confidence: ${exp.confidence}</span>`:''}
        ${exp.llm_provider?`<span class="ml-auto font-mono text-xs text-on-surface-variant bg-surface-container-low px-2 py-1 rounded-lg border border-outline-variant">via ${exp.llm_provider}</span>`:''}
      </div>
      ${exp.explanation?`<p class="text-sm text-on-surface leading-relaxed mb-4">${exp.explanation}</p>`:''}
      ${exp.root_cause||exp.recommended_action?`
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
        ${exp.root_cause?`<div class="border border-outline-variant rounded-lg p-4" style="border-left:3px solid #d97706">
          <div class="text-[10px] font-bold text-on-surface-variant uppercase tracking-wider mb-1">Root Cause</div>
          <p class="text-sm text-on-surface">${exp.root_cause}</p></div>`:''}
        ${exp.recommended_action?`<div class="border border-outline-variant rounded-lg p-4" style="border-left:3px solid #006a61">
          <div class="text-[10px] font-bold text-on-surface-variant uppercase tracking-wider mb-1">Recommended Action</div>
          <p class="text-sm text-on-surface">${exp.recommended_action}</p></div>`:''}
      </div>`:''}
      ${(exp.evidence_spl_queries||[]).length?`
      <div class="mb-4">
        <div class="text-[10px] font-bold text-on-surface-variant uppercase tracking-wider mb-2">Verification SPL</div>
        ${exp.evidence_spl_queries.map(q=>`<pre class="bg-primary text-secondary-fixed p-3 rounded-lg text-[11px] font-mono overflow-x-auto whitespace-pre-wrap mb-2">${q}</pre>`).join('')}
      </div>`:''}
      <div class="flex items-center gap-3 pt-3 border-t border-outline-variant">
        <span class="text-xs text-on-surface-variant">Helpful?</span>
        <button onclick="giveFeedback('${id}',1,this)" class="px-3 py-1 bg-surface-container border border-outline-variant rounded-lg text-sm hover:bg-secondary-container/20 transition-colors">👍</button>
        <button onclick="giveFeedback('${id}',-1,this)" class="px-3 py-1 bg-surface-container border border-outline-variant rounded-lg text-sm hover:bg-error-container/20 transition-colors">👎</button>
      </div>`
  } catch(e) {
    detail.querySelector('div').innerHTML = `<p class="text-sm text-error">Failed to load: ${e.message}</p>`
  }
}

async function giveFeedback(id, rating, btn) {
  await apiPost(`/incidents/${id}/feedback`, {rating})
  btn.parentElement.innerHTML = '<span class="text-secondary text-xs font-semibold">✓ Feedback recorded — thank you</span>'
}

      ${kpiCard({icon:'hub', label:'RAG-Indexed', value:ragCount, badge:`${Math.round(ragCount/Math.max(rb.length,1)*100)}%`, badgeOk:true})}
      ${kpiCard({icon:'category', label:'Types Covered', value:new Set(rb.map(r=>r.anomaly_type)).size, badge:'', badgeOk:true})}
      ${kpiCard({icon:'warning', label:'No Embedding', value:missing, badge:missing>0?'Needs indexing':null, badgeOk:false, iconBg:'bg-tertiary-fixed/30 text-on-tertiary-container'})}
    </section>
    <section class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden">
      <div class="px-5 py-4 border-b border-outline-variant">
        <h4 class="text-base font-semibold text-on-surface">Knowledge Base</h4>
        <p class="text-sm text-on-surface-variant">Runbooks are vectorised by Ollama and stored in pgvector for AI retrieval</p>
      </div>
      <div class="p-5">
        ${rb.length===0
          ? '<p class="text-center text-on-surface-variant py-8 text-sm">No runbooks yet. Create one in the React UI.</p>'
          : `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${cards}</div>`}
      </div>
    </section>`
  } catch(e) {
    el.innerHTML = `<div class="p-6 text-error text-sm">Failed to load: ${e.message}</div>`
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════════════════
function showApp() {
  document.getElementById('login-overlay').classList.add('hidden')
  document.getElementById('app').classList.remove('hidden')

  if (S.user) {
    const u = S.user.email.split('@')[0]
    const av = u.slice(0,2).toUpperCase()
    document.getElementById('user-name').textContent     = u
    document.getElementById('user-avatar').textContent   = av
    document.getElementById('header-name').textContent   = u
    document.getElementById('header-avatar').textContent = av
  }

  document.querySelectorAll('.nav-btn').forEach(btn => btn.addEventListener('click', ()=>switchView(btn.dataset.view)))
  document.getElementById('logout-btn').addEventListener('click', doLogout)
  document.getElementById('refresh-btn').addEventListener('click', ()=>{loadAll(); if(S.view==='incidents')renderIncidents(); if(S.view==='runbooks')renderRunbooks()})

  switchView('overview')
  loadAll()
  connectWS()
  probeServices()
  setInterval(loadAll, 30_000)
  setInterval(probeServices, 30_000)
}

document.getElementById('login-form').addEventListener('submit', async e=>{
  e.preventDefault()
  const btn = document.getElementById('login-btn')
  const err = document.getElementById('login-error')
  btn.textContent = 'Signing in…'; btn.disabled = true
  err.classList.add('hidden')
  try {
    await doLogin(document.getElementById('login-email').value, document.getElementById('login-password').value)
    showApp()
  } catch(ex) {
    err.textContent = ex.message; err.classList.remove('hidden')
    btn.textContent = 'Sign In'; btn.disabled = false
  }
})

if (loadAuth()) showApp()
</script>
</body>
</html>
