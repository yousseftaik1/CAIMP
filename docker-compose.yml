# =============================================================================
# CAIMP v2 — Infrastructure Services
# Application services are added in later phases.
# =============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — TimescaleDB + pgvector (app data + metrics + RAG index)
  # ---------------------------------------------------------------------------
  postgres:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    container_name: caimp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caimp}
      POSTGRES_USER: ${POSTGRES_USER:-caimp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - caimp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caimp} -d ${POSTGRES_DB:-caimp}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Database migrations — golang-migrate, runs once then exits
  # ---------------------------------------------------------------------------
  migrate:
    image: migrate/migrate:v4.17.0
    container_name: caimp-migrate
    volumes:
      - ./infra/postgres/migrations:/migrations:ro
    command: >
      -path=/migrations
      -database=postgres://${POSTGRES_USER:-caimp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-caimp}?sslmode=disable
      up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - caimp_net
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Redis — hot cache, rate-limit counters, agent revocation set, session state
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: caimp-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - caimp_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # NATS JetStream — durable event bus
  # ---------------------------------------------------------------------------
  nats:
    image: nats:2.10-alpine
    container_name: caimp-nats
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats-server.conf"]
    environment:
      NATS_USER: ${NATS_USER:-caimp}
      NATS_PASSWORD: ${NATS_PASSWORD}
      SYS_PASSWORD: ${SYS_PASSWORD:-change_me_sys}
    volumes:
      - ./infra/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats_data:/data
    ports:
      - "4222:4222"
      - "8222:8222"   # monitoring / HTTP
    networks:
      - caimp_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # NATS stream bootstrap — creates the 5 canonical JetStream streams, then exits
  # ---------------------------------------------------------------------------
  nats-setup:
    build:
      context: ./infra/nats
      dockerfile: Dockerfile
    container_name: caimp-nats-setup
    environment:
      NATS_URL: nats://nats:4222
      NATS_USER: ${NATS_USER:-caimp}
      NATS_PASSWORD: ${NATS_PASSWORD}
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - caimp_net
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Ollama — local LLM inference (llama3.1:8b + nomic-embed-text)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: caimp-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - caimp_net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/11434 && echo -e \"GET / HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n\" >&3 && grep -q \"200\" <(cat <&3)' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector — ingestion edge, mTLS, cardinality protection
  # OTel Collector — enable with: docker compose --profile otel up
  # ---------------------------------------------------------------------------
  otelcol:
    build:
      context: ./services/otel-collector
      dockerfile: Dockerfile
    container_name: caimp-otelcol
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      JWT_SECRET: ${JWT_SECRET}
      OTELCOL_REQUIRE_ORG_ID: ${OTELCOL_REQUIRE_ORG_ID:-true}
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
      - ./infra/otel-collector/certs:/etc/otelcol/certs:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus self-metrics
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - caimp_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:13133/ | grep -q 'Server available' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    profiles:
      - otel

  # ---------------------------------------------------------------------------
  # AI Orchestrator — conversational AI chat (SSE streaming via Ollama)
  # ---------------------------------------------------------------------------
  ai-orchestrator:
    build:
      context: ./services/ai-orchestrator
      dockerfile: Dockerfile
    container_name: caimp-ai-orchestrator
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-caimp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-caimp}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_LLM_MODEL:-llama3.1:8b-instruct-q4_K_M}
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET}
      PORT: "8010"
    ports:
      - "8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - caimp_net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Telemetry Writer — OTLP/HTTP → TimescaleDB COPY + anomaly detection + NATS
  # ---------------------------------------------------------------------------
  telemetry-writer:
    build:
      context: .
      dockerfile: services/telemetry-writer/Dockerfile
    container_name: caimp-telemetry-writer
    restart: unless-stopped
    environment:
      POSTGRES_DSN: postgres://${POSTGRES_USER:-caimp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-caimp}?sslmode=disable
      NATS_URL: nats://nats:4222
      NATS_USER: ${NATS_USER:-caimp}
      NATS_PASSWORD: ${NATS_PASSWORD}
      LISTEN_ADDR: :4318
      METRICS_ADDR: :9091
      BATCH_SIZE: ${TW_BATCH_SIZE:-2000}
      BATCH_FLUSH_SECONDS: ${TW_BATCH_FLUSH_SECONDS:-5}
      CPU_THRESHOLD_PCT: ${TW_CPU_THRESHOLD_PCT:-90}
      RAM_THRESHOLD_PCT: ${TW_RAM_THRESHOLD_PCT:-90}
      DISK_THRESHOLD_PCT: ${TW_DISK_THRESHOLD_PCT:-85}
      RATE_CHANGE_PCT: ${TW_RATE_CHANGE_PCT:-20}
      ZSCORE_THRESHOLD: ${TW_ZSCORE_THRESHOLD:-3.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "4319:4318"
      - "9091:9091"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - caimp_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4318/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Forecast Engine — Holt-Winters predictions + LLM narratives + accuracy loop
  # ---------------------------------------------------------------------------
  forecast-engine:
    build:
      context: .
      dockerfile: services/forecast-engine/Dockerfile
    container_name: caimp-forecast-engine
    restart: unless-stopped
    environment:
      POSTGRES_DSN: postgres://${POSTGRES_USER:-caimp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-caimp}?sslmode=disable
      NATS_URL: nats://nats:4222
      NATS_USER: ${NATS_USER:-caimp}
      NATS_PASSWORD: ${NATS_PASSWORD}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-llama3.1:8b-instruct-q4_K_M}
      FORECAST_INTERVAL_MINUTES: 30
      FORECAST_HORIZON_HOURS: 24
      FORECAST_CRITICAL_THRESHOLD: 0.9
      FORECAST_MIN_DATA_POINTS: 24
      METRICS_PORT: 9094
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "9094:9094"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - caimp_net
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # AI Worker Pool — NATS ANOMALIES → Ollama LLM → ai_explanations + AI_OUT
  # ---------------------------------------------------------------------------
  ai-worker:
    build:
      context: .
      dockerfile: services/ai-worker/Dockerfile
    container_name: caimp-ai-worker
    restart: unless-stopped
    environment:
      POSTGRES_DSN: postgres://${POSTGRES_USER:-caimp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-caimp}?sslmode=disable
      NATS_URL: nats://nats:4222
      NATS_USER: ${NATS_USER:-caimp}
      NATS_PASSWORD: ${NATS_PASSWORD}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-llama3.1:8b-instruct-q4_K_M}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      AI_WORKER_CONCURRENCY: ${AI_WORKER_CONCURRENCY:-2}
      METRICS_PORT: 9092
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "9092:9092"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - caimp_net
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Alert Engine — threshold rule evaluation, anomaly persistence, notifications
  # ---------------------------------------------------------------------------
  alert-engine:
    build:
      context: .
      dockerfile: services/alert-engine/Dockerfile
    container_name: caimp-alert-engine
    restart: unless-stopped
    environment:
      POSTGRES_DSN: postgres://${POSTGRES_USER:-caimp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-caimp}?sslmode=disable
      NATS_URL: nats://nats:4222
      NATS_USER: ${NATS_USER:-caimp}
      NATS_PASSWORD: ${NATS_PASSWORD}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ALERT_RULES_CACHE_TTL: ${ALERT_RULES_CACHE_TTL:-60}
      METRICS_PORT: 9093
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "9093:9093"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - caimp_net
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Admin API — org/user/server management, PKI enrollment, JWT auth
  # ---------------------------------------------------------------------------
  admin-api:
    build:
      context: .
      dockerfile: services/api-admin/Dockerfile
    container_name: caimp-admin-api
    restart: unless-stopped
    environment:
      POSTGRES_DSN: postgres://${POSTGRES_USER:-caimp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-caimp}?sslmode=disable
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-480}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-7}
      CA_KEY_PASSPHRASE: ${CA_KEY_PASSPHRASE}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - caimp_net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Query API — time-series metrics, anomalies, AI explanations (read-only)
  # ---------------------------------------------------------------------------
  query-api:
    build:
      context: .
      dockerfile: services/api-query/Dockerfile
    container_name: caimp-query-api
    restart: unless-stopped
    environment:
      POSTGRES_DSN: postgres://${POSTGRES_USER:-caimp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-caimp}?sslmode=disable
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - caimp_net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # WebSocket Gateway — NATS subscriptions → live browser push
  # ---------------------------------------------------------------------------
  ws-gateway:
    build:
      context: .
      dockerfile: services/ws-gateway/Dockerfile
    container_name: caimp-ws-gateway
    restart: unless-stopped
    environment:
      NATS_URL: nats://nats:4222
      NATS_USER: ${NATS_USER:-caimp}
      NATS_PASSWORD: ${NATS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - caimp_net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Frontend — React SPA served by Nginx
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: caimp-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - caimp_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Prometheus — scrapes /metrics from all services
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: caimp-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - caimp_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Grafana — service-health dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.2
    container_name: caimp-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL:         "%(protocol)s://%(domain)s/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - caimp_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Nginx — TLS termination, rate limiting, reverse proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: caimp-nginx
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      - telemetry-writer
      - admin-api
      - query-api
      - ws-gateway
      - frontend
    networks:
      - caimp_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ---------------------------------------------------------------------------
  change-tracker:
    build:
      context: ./services/change-tracker
      dockerfile: Dockerfile
    container_name: caimp-change-tracker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-caimp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-caimp}
      NATS_URL: nats://nats:4222
      NATS_USER: ${NATS_USER:-caimp}
      NATS_PASSWORD: ${NATS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      PORT: "8011"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8011:8011"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - caimp_net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8011/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Correlation Engine — "What changed before this broke?"
  # Subscribes to ANOMALIES.*, scores change_events, calls LLM for narrative,
  # saves root_cause_analyses, publishes ROOT_CAUSE.* to NATS
  # ---------------------------------------------------------------------------
  correlation-engine:
    build:
      context: ./services/correlation-engine
      dockerfile: Dockerfile
    container_name: caimp-correlation-engine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-caimp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-caimp}
      NATS_URL: nats://nats:4222
      NATS_USER: ${NATS_USER:-caimp}
      NATS_PASSWORD: ${NATS_PASSWORD}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-llama3.1:8b-instruct-q4_K_M}
      LOOKBACK_MINUTES: "30"
      PORT: "9095"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "9095:9095"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      ollama:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - caimp_net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9095/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

# =============================================================================
# Named volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nats_data:
    driver: local
  ollama_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local


# =============================================================================
# Networks
# =============================================================================
networks:
  caimp_net:
    driver: bridge
    name: caimp_net
