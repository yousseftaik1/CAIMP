name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Python — ruff lint + mypy type check (all Python services + libs)
  # ---------------------------------------------------------------------------
  python-lint:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ruff and mypy
        run: pip install ruff mypy types-redis pyjwt cryptography

      - name: ruff lint
        run: ruff check services/ libs/

      - name: ruff format check
        run: ruff format --check services/ libs/

      - name: mypy — libs/auth
        run: mypy libs/auth/caimp_auth/ --ignore-missing-imports

      - name: mypy — admin-api
        run: mypy services/api-admin/admin_api/ --ignore-missing-imports

      - name: mypy — query-api
        run: mypy services/api-query/query_api/ --ignore-missing-imports

      - name: mypy — ai-worker
        run: mypy services/ai-worker/ai_worker/ --ignore-missing-imports

      - name: mypy — alert-engine
        run: mypy services/alert-engine/alert_engine/ --ignore-missing-imports

      - name: mypy — ws-gateway
        run: mypy services/ws-gateway/ws_gateway/ --ignore-missing-imports

  # ---------------------------------------------------------------------------
  # Go — build + vet (telemetry-writer + otel-collector tenancy processor)
  # ---------------------------------------------------------------------------
  go-build:
    name: Go Build & Vet
    runs-on: ubuntu-latest
    env:
      GONOSUMCHECK: github.com/jackc/pgservicefile
      GONOSUMDB: github.com/jackc/pgservicefile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: services/telemetry-writer/go.sum

      # go.mod replaces pgservicefile with /pgservicefile (same as the Dockerfile).
      # Clone the current HEAD so go vet / go build can resolve the replacement.
      - name: Clone pgservicefile (replace directive dependency)
        run: sudo git clone --depth=1 https://github.com/jackc/pgservicefile.git /pgservicefile

      - name: go vet — telemetry-writer
        working-directory: services/telemetry-writer
        run: go vet ./...

      - name: go build — telemetry-writer
        working-directory: services/telemetry-writer
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/main.go

      - name: go vet — otel-collector tenancy processor
        working-directory: services/otel-collector/processor/tenancyprocessor
        run: go vet ./...
        continue-on-error: true   # plugin may not build standalone; best-effort

  # ---------------------------------------------------------------------------
  # Frontend — TypeScript type-check + Vite build
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm install
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Vite production build
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  # Docker — build all images (no push; validates Dockerfiles + build contexts)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [python-lint, go-build, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build telemetry-writer
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/telemetry-writer/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build admin-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/api-admin/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build query-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/api-query/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ai-worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/ai-worker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build alert-engine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/alert-engine/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ws-gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/ws-gateway/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Integration tests — smoke test all health endpoints via Docker Compose
  # ---------------------------------------------------------------------------
  integration:
    name: Integration Smoke Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    env:
      POSTGRES_PASSWORD: test_postgres
      REDIS_PASSWORD:    test_redis
      NATS_PASSWORD:     test_nats
      JWT_SECRET:        test_jwt_secret_that_is_at_least_64_chars_long_xxxxxxxxxxxxxxxxxxx
      CA_KEY_PASSPHRASE: test_ca_passphrase
      GRAFANA_ADMIN_PASSWORD: test_grafana
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest + httpx
        run: pip install pytest httpx pytest-asyncio

      - name: Write .env for docker compose
        run: |
          cat > .env <<EOF
          POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}
          REDIS_PASSWORD=${{ env.REDIS_PASSWORD }}
          NATS_PASSWORD=${{ env.NATS_PASSWORD }}
          JWT_SECRET=${{ env.JWT_SECRET }}
          CA_KEY_PASSPHRASE=${{ env.CA_KEY_PASSPHRASE }}
          GRAFANA_ADMIN_PASSWORD=${{ env.GRAFANA_ADMIN_PASSWORD }}
          EOF

      - name: Start infrastructure services
        run: docker compose up -d postgres redis nats migrate nats-setup

      - name: Wait for infrastructure to be healthy
        run: |
          docker compose ps
          # Poll until migrate and nats-setup containers exit successfully
          for i in $(seq 1 30); do
            MIGRATE=$(docker compose ps --status exited migrate 2>/dev/null | grep -c migrate || true)
            NATS_SETUP=$(docker compose ps --status exited nats-setup 2>/dev/null | grep -c nats-setup || true)
            if [ "$MIGRATE" -ge 1 ] && [ "$NATS_SETUP" -ge 1 ]; then
              echo "Infrastructure ready"; break
            fi
            echo "Waiting... ($i/30)"; sleep 5
          done

      - name: Start application services
        run: docker compose up -d admin-api query-api ws-gateway

      - name: Wait for API services
        run: sleep 25

      - name: Run smoke tests
        run: pytest tests/integration/ -v --tb=short

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=100
